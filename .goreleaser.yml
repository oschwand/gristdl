version: 2
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    ldflags:
      - -s -w
      - -X github.com/oschwand/gristdl/internal/version.Version={{.Version}}
      - -X github.com/oschwand/gristdl/internal/version.Commit={{.FullCommit}}
      - -X github.com/oschwand/gristdl/internal/version.Date={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
